name: Aggiorna prezzi e sito

on:
  schedule:
    - cron: "7,37 * * * *"    # ogni mezz'ora
  workflow_dispatch:
    inputs:
      full:
        description: "Aggiorna tutto il catalogo (più lento)"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: impara-investire-github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: impara-investire-github/robot/requirements.txt
      - run: pip install -r robot/requirements.txt
      - name: Prepara la cartella del sito
        run: |
          mkdir -p _site data
          for f in index.html guida.html manifest.webmanifest sw.js config.json icon-192.png icon-512.png; do if [ -f "$f" ]; then cp "$f" _site/; else echo "manca $f"; fi; done
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/prices.json" -o _site/prices.json || echo "nessun prezzo precedente"
      - name: Scarica i prezzi
        env:
          FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '1' || '' }}
          MAX_RESOLVE: "1500"
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python robot/update.py
      - name: Salva la memoria del robot
        run: |
          git config user.name "robot-prezzi"
          git config user.email "robot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Robot: aggiorna simboli ed eventi"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done || echo "salvataggio rimandato al prossimo giro"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: impara-investire-github/_site
      - id: deploy
        uses: actions/deploy-pages@v4
